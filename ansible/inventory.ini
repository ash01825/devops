# ============================================================
# Water Quality Sampling Portal — Ansible inventory
# Local deploy target (staging on this machine).
# Usage: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
#
# Tunables (app_version, app_port, deploy_dir, ...) live as defaults in
# playbook.yml `vars:` — this file intentionally defines none, so there is
# exactly one source of truth. Override any of them per run, e.g.:
#   -e app_version=1.0.1 -e deploy_dir=$HOME/wq-portal-deploy
# ============================================================

[portal]
localhost ansible_connection=local
