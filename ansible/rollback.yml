# ============================================================
# Water Quality Sampling Portal — rollback playbook
# Rolls the app back to a previous stable image tag THROUGH compose, so the
# compose state (image tag, env, network) always matches what is running.
# Usage:
#   ansible-playbook -i ansible/inventory.ini ansible/rollback.yml \
#     -e "prev_version=1.0.0"
# Health-gates the rollback: fails if the old version is not healthy.
# The image must exist locally (locally built releases, no registry push).
# ============================================================

- name: Roll back portal app to previous stable image
  hosts: portal
  become: false
  vars:
    prev_version: "1.0.0"   # override with -e prev_version=X.Y.Z
    app_port: 8080
    app_context: water-quality-portal
    deploy_dir: /opt/wq-portal
    compose_project: wq-portal

  tasks:
    - name: Validate prev_version is set
      ansible.builtin.assert:
        that:
          - prev_version is defined
          - prev_version | length > 0
        fail_msg: "Pass the stable tag: -e prev_version=1.0.0"

    - name: Show rollback target
      ansible.builtin.debug:
        msg: "Rolling back app to water-quality-portal:{{ prev_version }}"
      changed_when: false

    - name: Verify rollback image exists locally (no blind pull)
      community.docker.docker_image_info:
        name: "water-quality-portal:{{ prev_version }}"
      register: prev_image

    - name: Fail with guidance when the image is missing
      ansible.builtin.fail:
        msg: "Image water-quality-portal:{{ prev_version }} not in local daemon. Build it first (docker build -f docker/Dockerfile -t water-quality-portal:{{ prev_version }} .) or pick an existing tag (docker images water-quality-portal)."
      when: prev_image.images | length == 0

    - name: Switch compose stack to the previous image tag
      ansible.builtin.command:
        cmd: docker compose -p {{ compose_project }} -f {{ deploy_dir }}/docker-compose.yml up -d
      environment:
        APP_VERSION: "{{ prev_version }}"
      register: compose_switch
      changed_when: "'Started' in compose_switch.stdout or 'Recreated' in compose_switch.stdout or 'Creating' in compose_switch.stdout"

    - name: Wait for app port to open after rollback
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ app_port }}"
        delay: 5
        timeout: 180

    - name: Health-check actuator endpoint after rollback (expect 200)
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/{{ app_context }}/actuator/health"
        method: GET
        status_code: 200
        return_content: true
      register: health
      retries: 12
      delay: 10
      until: health.status == 200

    - name: Report rollback result
      ansible.builtin.debug:
        msg: "Rollback to {{ prev_version }} healthy: HTTP {{ health.status }}"
      changed_when: false
