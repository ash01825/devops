# ============================================================
# Water Quality Sampling Portal — local / staging stack
# Usage: docker compose -f docker/docker-compose.yml up -d --build
# App:  http://localhost:8080/water-quality-portal/
# Docs: see docker/README.md
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: wq-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: waterquality
      POSTGRES_USER: wquser
      POSTGRES_PASSWORD: wqpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host 5433 (host 5432 is commonly taken by a native Postgres).
      # The app still reaches the DB internally at db:5432.
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wquser -d waterquality"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: water-quality-portal:1.0.0
    container_name: wq-portal-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/waterquality
      SPRING_DATASOURCE_USERNAME: wquser
      SPRING_DATASOURCE_PASSWORD: wqpass
      DB_URL: jdbc:postgresql://db:5432/waterquality
      DB_USER: wquser
      DB_PASS: wqpass
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/water-quality-portal/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
    name: wq-portal-pgdata
