spring:
  application:
    name: water-quality-portal

  datasource:
    url: jdbc:h2:mem:waterquality;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    context-path: /water-quality-portal

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.waterquality.portal: INFO
