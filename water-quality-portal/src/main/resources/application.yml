spring:
  application:
    name: water-quality-portal

  datasource:
    url: jdbc:h2:mem:waterquality;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    context-path: /water-quality-portal

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.waterquality.portal: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/waterquality}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:wquser}
    password: ${DB_PASS:wqpass}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
