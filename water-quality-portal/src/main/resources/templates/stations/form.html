<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Water Quality Portal — New Station</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230e7490' d='M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0C19 10 12 2 12 2z'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">💧 Water Quality Portal <small>· stations (admin)</small></div>
    <nav class="nav">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/samples}">Samples</a>
        <a th:href="@{/samples/new}">+ New Sample</a>
        <a th:href="@{/stations}" sec:authorize="hasRole('ADMIN')">Stations</a>
    </nav>
    <div class="userbox">
        <span sec:authentication="name">user</span>
        <span class="role" sec:authentication="principal.authorities">[ROLE]</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="linkbtn" type="submit">Logout</button>
        </form>
    </div>
</header>
<div class="container">
    <div class="card">
        <h2>New station</h2>
        <div th:if="${success}" class="alert success" role="alert" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" role="alert" th:text="${error}"></div>
        <form th:action="@{/stations}" th:object="${station}" method="post" id="stationForm">
            <div class="form-grid">
                <div class="field"><label for="code">Code *</label>
                    <input id="code" th:field="*{code}" placeholder="ST-05" required>
                    <div class="err" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>
                <div class="field"><label for="name">Name *</label>
                    <input id="name" th:field="*{name}" required>
                    <div class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="field"><label for="waterBody">Water body</label>
                    <input id="waterBody" th:field="*{waterBody}"></div>
                <div class="field"><label for="latitude">Latitude (−90…90)</label>
                    <input id="latitude" type="number" step="0.0001" min="-90" max="90" th:field="*{latitude}"></div>
                <div class="field"><label for="longitude">Longitude (−180…180)</label>
                    <input id="longitude" type="number" step="0.0001" min="-180" max="180" th:field="*{longitude}"></div>
            </div>
            <button class="btn" type="submit" id="saveStationBtn">Create station</button>
            <a class="btn secondary" th:href="@{/stations}">Cancel</a>
        </form>
    </div>
</div>
<footer class="footer">Water Quality Sampling Portal · DevOps MVP · DRAFT → SUBMITTED → UNDER_REVIEW → APPROVED | REJECTED</footer>
</body>
</html>
