<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Water Quality Portal — Samples</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">💧 Water Quality Portal <small>· samples</small></div>
    <nav class="nav">
        <a th:href="@{/dashboard}" id="navDashboard">Dashboard</a>
        <a th:href="@{/samples}" id="navSamples">Samples</a>
        <a th:href="@{/samples/new}" id="navNew">+ New Sample</a>
        <a th:href="@{/stations}" id="navStations" sec:authorize="hasRole('ADMIN')">Stations</a>
    </nav>
    <div class="userbox">
        <span sec:authentication="name">user</span>
        <span class="role" sec:authentication="principal.authorities">[ROLE]</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="linkbtn" type="submit">Logout</button>
        </form>
    </div>
</header>

<div class="container">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>

    <div class="card">
        <h2>Search samples</h2>
        <form th:action="@{/samples}" method="get" id="searchForm">
            <div class="searchbar">
                <div class="field">
                    <label for="q">Keyword (ID / collector / notes)</label>
                    <input type="text" id="q" name="q" th:value="${q}" placeholder="e.g. WQ-0001">
                </div>
                <div class="field">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="">All</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                                th:selected="${st == selectedStatus}">DRAFT</option>
                    </select>
                </div>
                <div class="field">
                    <label for="stationId">Station</label>
                    <select id="stationId" name="stationId">
                        <option value="">All</option>
                        <option th:each="stn : ${stations}" th:value="${stn.id}"
                                th:text="${stn.code}" th:selected="${stn.id == selectedStationId}">ST-01</option>
                    </select>
                </div>
                <div class="field">
                    <label for="from">From</label>
                    <input type="date" id="from" name="from" th:value="${from}">
                </div>
                <div class="field">
                    <label for="to">To</label>
                    <input type="date" id="to" name="to" th:value="${to}">
                </div>
                <div class="field">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn" id="searchBtn">Search</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Samples (<span th:text="${#lists.size(samples)}">0</span>)</h2>
        <table class="data" id="samplesTable">
            <thead>
            <tr><th>Sample ID</th><th>Station</th><th>Collected</th><th>Collector</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${samples}">
                <td th:text="${s.sampleId}">WQ-0001</td>
                <td th:text="${s.station.code + ' — ' + s.station.name}">ST-01</td>
                <td th:text="${#temporals.format(s.collectedAt, 'yyyy-MM-dd HH:mm')}">date</td>
                <td th:text="${s.collector}">collector</td>
                <td><span class="badge" th:classappend="${s.status}" th:text="${s.status}">DRAFT</span></td>
                <td><a th:href="@{/samples/{id}(id=${s.id})}">View</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(samples)}">
                <td colspan="6" id="noResults">No samples match your search.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer class="footer">Water Quality Sampling Portal · DevOps MVP</footer>
</body>
</html>
